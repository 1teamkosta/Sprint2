<!-- 공통 사이드바: 메뉴 화면이 구현되면 비활성 버튼을 링크로 변경 -->
<aside class="admin-sidebar d-flex flex-column p-3">
    <a class="admin-brand text-decoration-none px-2 mb-4" th:href="@{/admin/festivalsView}">
        <strong>축제메이트</strong>
        <span class="admin-brand-subtitle d-block small mt-1">관리자 페이지</span>
    </a>
    <nav aria-label="관리자 메뉴">
        <ul class="nav nav-pills flex-column gap-2">
            <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'dashboard'} ? ' active'" th:href="@{/admin/dashboardView}" data-page="dashboard" th:attr="aria-current=${activePage == 'dashboard'} ? 'page' : null">대시보드</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'tags'} ? ' active'" th:href="@{/admin/tagsView}" data-page="tags" th:attr="aria-current=${activePage == 'tags'} ? 'page' : null">태그 관리</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${activePage == null or activePage == 'festival'} ? ' active'" th:href="@{/admin/festivalsView}" data-page="festival" th:attr="aria-current=${activePage == null or activePage == 'festival'} ? 'page' : null">축제 관리</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'club'} ? ' active'" th:href="@{/admin/clubsView}" data-page="club" th:attr="aria-current=${activePage == 'club'} ? 'page' : null">모임 관리</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'users'} ? ' active'" th:href="@{/admin/usersView}" data-page="users" th:attr="aria-current=${activePage == 'users'} ? 'page' : null">회원 관리</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'notices'} ? ' active'" th:href="@{/admin/noticesView}" data-page="notices" th:attr="aria-current=${activePage == 'notices'} ? 'page' : null">공지 관리</a></li>
        </ul>
    </nav>
    <div class="admin-account mt-auto">
<!--        <p class="mb-2 fw-semibold">관리자</p>-->
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-secondary btn-sm w-100" type="submit">로그아웃</button>
        </form>
    </div>
</aside>
