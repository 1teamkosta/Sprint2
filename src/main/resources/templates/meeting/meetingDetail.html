<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>모임 상세 | 축제메이트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="../../static/css/component.css" rel="stylesheet">
    <link href="../../static/css/meetingDetail.css" rel="stylesheet">
    <script src="../../static/js/component.js" defer></script>
    <script src="../../static/js/meetingDetail.js" defer></script>
</head>
<body data-admin-page="meeting">
    <a class="visually-hidden-focusable skip-link" href="#main-content">본문 바로가기</a>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <main id="main-content" class="admin-main" tabindex="-1">
        <div class="container-fluid">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <h1 class="h3 fw-bold mb-0">모임 상세</h1>
                <div class="d-flex gap-2">
                    <button class="btn meeting-detail-private" type="button" id="meeting-detail-hide" disabled>비공개</button>
                    <a class="btn btn-primary" href="meetings.html">목록으로</a>
                </div>
            </div>
            <p class="small text-secondary" id="meeting-detail-feedback" role="status">모임 정보를 불러오는 중입니다.</p>
            <article class="meeting-detail-card" id="meeting-detail-card" aria-labelledby="meeting-detail-title" hidden>
                <div class="meeting-detail-layout">
                    <div class="meeting-detail-main">
                        <div class="mb-4">
                            <span class="badge meeting-detail-visible mb-3" id="meeting-detail-status">공개</span>
                            <h2 class="h4 fw-bold mb-0" id="meeting-detail-title">모임 이름</h2>
                        </div>
                        <dl class="meeting-detail-info meeting-detail-dates mb-0">
                            <div class="meeting-detail-info-row meeting-detail-date"><dt>모임일</dt><dd><time id="meeting-detail-meeting-date"></time></dd></div>
                            <div class="meeting-detail-info-row meeting-detail-date"><dt>개설일</dt><dd><time id="meeting-detail-created"></time></dd></div>
                        </dl>
                        <dl class="meeting-detail-info mb-0">
                            <div class="meeting-detail-info-row">
                                <dt>축제 이름</dt>
                                <dd><a class="meeting-detail-festival" id="meeting-detail-festival" href="../festival/festivals.html">축제 이름</a></dd>
                            </div>
                            <div class="meeting-detail-info-row meeting-detail-description-row">
                                <dt>모임 내용</dt>
                                <dd id="meeting-detail-description"></dd>
                            </div>
                        </dl>
                        <!-- 인원과 모임 내용은 시연용 데이터. 서버 연동 시 상세 응답으로 교체한다. -->
                        <dl class="meeting-detail-summary">
                            <div><dt>현재 인원</dt><dd>2명</dd></div>
                            <div><dt>최대 인원</dt><dd>5명</dd></div>
                            <div><dt>모임 목적</dt><dd id="meeting-detail-purpose">축제메이트</dd></div>
                        </dl>
                    </div>
                    <section class="meeting-detail-members" aria-labelledby="meeting-members-heading">
                        <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
                            <h3 class="h6 fw-semibold mb-0" id="meeting-members-heading">참여자</h3>
                            <span class="small text-secondary">2 / 5명</span>
                        </div>
                        <ul class="list-unstyled mb-0">
                            <li><a class="meeting-member-name list-detail-link" id="meeting-detail-host" href="../users/users.html">개설자</a><span class="meeting-member-role">개설자</span></li>
                            <li><a class="meeting-member-name list-detail-link" id="meeting-detail-member" href="../users/users.html">참여자</a><span class="meeting-member-role">참여자</span></li>
                        </ul>
                    </section>
                </div>
            </article>
        </div>
    </main>
</body>
</html>
