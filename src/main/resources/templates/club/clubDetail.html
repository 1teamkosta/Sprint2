<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>모임 상세 | 축제메이트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link th:href="@{/css/component.css}" rel="stylesheet">
    <link th:href="@{/css/clubDetail.css}" rel="stylesheet">
    <script th:src="@{/js/clubDetail.js}" defer></script>
</head>
<body data-admin-page="club" th:attr="data-club-public=${club == null or club.status == 1}">
    <a class="visually-hidden-focusable skip-link" href="#main-content">본문 바로가기</a>
    <div th:replace="~{component/header}"></div>
    <div th:replace="~{component/sidebar}"></div>
    <main id="main-content" class="admin-main" tabindex="-1">
        <div class="container-fluid">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <h1 class="h3 fw-bold mb-0">모임 상세</h1>
                <div class="d-flex gap-2">
                    <button class="btn club-detail-private" type="button" id="club-detail-hide"
                            th:attr="data-update-url=@{/admin/club/{clubNumber}(clubNumber=${club.clubNumber})}"
                            th:text="${club.status == 1 ? '비공개' : '공개'}">비공개</button>
                    <a class="btn btn-primary" th:href="@{/admin/clubsView}">목록으로</a>
                </div>
            </div>
            <article class="club-detail-card" id="club-detail-card" aria-labelledby="club-detail-title">
                <div class="club-detail-layout">
                    <div class="club-detail-main">
                        <div class="mb-4">
                            <span id="club-detail-status" th:class="${club != null and club.status == 0 ? 'badge club-detail-hidden mb-3' : 'badge club-detail-visible mb-3'}" th:text="${club != null ? (club.status == 1 ? '공개' : '비공개') : '공개'}">공개</span>
                            <h2 class="h4 fw-bold mb-0" id="club-detail-title" th:text="${club != null ? club.clubName : '모임 이름'}">모임 이름</h2>
                        </div>
                        <dl class="club-detail-info club-detail-dates mb-0">
                            <div class="club-detail-info-row club-detail-date"><dt>모임일시</dt><dd><time id="club-detail-club-date" th:text="${club != null ? club.meetingDate : '일정 미정'}">일정 미정</time></dd></div>
                            <div class="club-detail-info-row club-detail-date"><dt>개설일시</dt><dd><time id="club-detail-created" th:text="${club != null ? club.createdAt : '미정'}">미정</time></dd></div>
                        </dl>
                        <dl class="club-detail-info mb-0">
                            <div class="club-detail-info-row">
                                <dt>축제 이름</dt>
                                <dd><a class="club-detail-festival" id="club-detail-festival" th:href="@{/admin/festivalView/{festivalNumber}(festivalNumber=${club != null ? club.festivalNumber : 1})}" th:text="${club != null ? club.festivalName : '축제 이름'}">축제 이름</a></dd>
                            </div>
                            <div class="club-detail-info-row club-detail-description-row">
                                <dt>모임 내용</dt>
                                <dd id="club-detail-description" th:text="${club != null ? club.contents : '모임 소개가 표시될 영역입니다.'}">모임 소개가 표시될 영역입니다.</dd>
                            </div>
                        </dl>
                        <dl class="club-detail-summary">
                            <div><dt>모임 목적</dt><dd id="club-detail-purpose" th:text="${club != null ? club.purpose : '축제메이트'}">축제메이트</dd></div>
                            <div><dt>현재 인원</dt><dd><span th:text="${club != null ? club.curCount : 2}">2</span>명</dd></div>
                            <div><dt>최대 인원</dt><dd><span th:text="${club != null ? club.maxCount : 5}">5</span>명</dd></div>
                        </dl>
                    </div>
                    <section class="club-detail-members" aria-labelledby="club-members-heading">
                        <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
                            <h3 class="h6 fw-semibold mb-0" id="club-members-heading">참여자</h3>
                            <span class="small text-secondary"><span th:text="${club.curCount}">2</span> / <span th:text="${club.maxCount}">5</span>명</span>
                        </div>
                        <ul class="list-unstyled mb-0">
                            <li th:each="attendee : ${clubAttendee}">
                                <a class="club-member-name list-detail-link" th:text="${attendee.nickname}" th:href="@{/admin/userDetail/{accountNumber}(accountNumber=${attendee.accountNumber})}">닉네임</a>
                                <span class="club-member-role" th:text="${attendee.attendeeRole == 0 ? '개설자' : '참여자'}"></span>
                            </li>
                        </ul>
                    </section>
                </div>
            </article>
        </div>
    </main>
</body>
</html>
