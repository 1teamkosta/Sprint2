<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인 | 축제메이트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="../static/css/login.css" rel="stylesheet">
</head>
<body class="login-page">
    <main class="login-main">
        <div class="login-brand">
            <strong>축제메이트</strong>
        </div>

        <section class="login-card" aria-labelledby="login-heading">
            <header class="login-heading">
                <h1 id="login-heading">로그인</h1>
            </header>


            <form action="/login"  method="post" class="login-form">
                <div class="login-field">
                    <label for="login-id" class="form-label">아이디</label>
                    <input id="login-id" class="form-control" name="username" type="text"
                           placeholder="아이디를 입력하세요" autocomplete="username"
                           autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="login-field">
                    <label for="login-password" class="form-label">비밀번호</label>
                    <input id="login-password" class="form-control" name="password" type="password"
                           placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn login-submit">로그인</button>
            </form>
        </section>
    </main>
</body>
</html>
