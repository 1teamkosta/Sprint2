<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공지 관리 | 축제메이트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link th:href="@{/css/component.css}" rel="stylesheet">
    <link th:href="@{/css/notices.css}" rel="stylesheet">
    <script th:src="@{/js/list.js}" defer></script>
    <script th:src="@{/js/notices.js}" defer></script>
</head>
<body data-admin-page="notices">
    <a class="visually-hidden-focusable skip-link" href="#main-content">본문 바로가기</a>
    <div th:replace="~{component/header}"></div>
    <div th:replace="~{component/sidebar}"></div>

    <main id="main-content" class="admin-main" tabindex="-1">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
                <h1 class="h3 fw-bold mb-0">공지 관리</h1>
                <a class="btn btn-primary" th:href="@{/admin/noticeAddView}">공지 추가</a>
            </div>
            <section class="bg-white border rounded-3 p-4" aria-labelledby="notice-list-heading">
                <h2 class="visually-hidden" id="notice-list-heading">공지 목록과 검색</h2>
                <div class="list-toolbar d-flex flex-wrap align-items-center gap-3 mb-3">
                    <div class="list-bulk-actions d-flex align-items-center gap-2" role="group" aria-label="선택한 공지 삭제">
                        <button class="btn notice-bulk-delete btn-sm" id="notice-delete-selected" type="button">선택 삭제</button>
                    </div>
                    <form class="notice-search ms-auto" role="search" aria-label="공지 제목 검색">
                        <label class="visually-hidden" for="notice-search-type">검색 기준</label>
                        <select class="form-select visually-hidden" id="notice-search-type" name="searchBy" aria-hidden="true" tabindex="-1">
                            <option value="title">제목</option>
                        </select>
                        <label class="visually-hidden" for="notice-keyword">검색할 제목</label>
                        <div class="input-group">
                            <input class="form-control" id="notice-keyword" name="keyword" type="search" placeholder="검색할 제목을 입력하세요">
                            <button class="btn btn-outline-primary" type="submit">검색</button>
                        </div>
                    </form>
                </div>
                <p class="small text-secondary mb-2" id="notice-result-count" role="status">공지 목록을 불러오는 중입니다.</p>
                <div class="notice-table-wrap">
                    <table class="table table-hover align-middle notice-table mb-0">
                        <caption class="visually-hidden">공지 목록. 페이지당 10개, 작성일 정렬 가능.</caption>
                        <colgroup>
                            <col class="notice-column-select">
                            <col class="notice-column-number">
                            <col class="notice-column-title">
                            <col class="notice-column-date">
                        </colgroup>
                        <thead class="table-light text-center">
                            <tr>
                                <th scope="col" class="list-selection-column"><input class="form-check-input list-selection-input" type="checkbox" id="notice-select-all" aria-label="현재 페이지 공지 전체 선택"></th>
                                <th scope="col">번호</th>
                                <th scope="col">제목</th>
                                <th scope="col"><button class="column-sort" type="button" data-sort="inDate" aria-label="작성일 정렬">작성일 <span aria-hidden="true">↕</span></button></th>
                            </tr>
                        </thead>
                        <tbody class="text-center" id="notice-list"></tbody>
                    </table>
                </div>
                <nav class="mt-4" aria-label="공지 목록 페이지" id="notice-pagination" data-current-page="1" data-total-pages="0" data-total-count="0">
                    <ul class="pagination justify-content-center mb-0"></ul>
                </nav>
            </section>
        </div>
    </main>
</body>
</html>
