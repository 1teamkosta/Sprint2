<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공지 상세 | 축제메이트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link th:href="@{/css/component.css}" rel="stylesheet">
    <link th:href="@{/css/noticeDetail.css}" rel="stylesheet">
    <script th:src="@{/js/noticeDetail.js}" defer></script>
</head>
<body data-admin-page="notices" th:attr="data-notice-number=${notice.noticeNumber}">
    <a class="visually-hidden-focusable skip-link" href="#main-content">본문 바로가기</a>
    <div th:replace="~{component/header}"></div>
    <div th:replace="~{component/sidebar}"></div>
    <main id="main-content" class="admin-main" tabindex="-1">
        <div class="container-fluid">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <h1 class="h3 fw-bold mb-0">공지 상세</h1>
                <div class="d-flex gap-2" role="group" aria-label="공지 관리">
                    <button class="btn notice-detail-delete notice-detail-action" id="notice-delete" type="button">삭제</button>
                    <a class="btn btn-secondary notice-detail-action" id="notice-edit"
                       th:href="@{/admin/noticeEditView/{noticeNumber}(noticeNumber=${notice.noticeNumber})}">수정</a>
                    <a class="btn btn-primary notice-detail-action" th:href="@{/admin/noticesView}">목록으로</a>
                </div>
            </div>
            <p class="small text-secondary" id="notice-detail-feedback" role="status" hidden></p>
            <article class="notice-detail-card" aria-labelledby="notice-detail-title">
                <header class="notice-detail-heading">
                    <h2 class="h4 fw-bold" id="notice-detail-title" th:text="${notice.title}">공지 제목</h2>
                    <p class="notice-detail-date"><span class="visually-hidden">작성일 </span><time id="notice-detail-created" th:text="${notice.inDate}">작성일</time></p>
                </header>
                <div class="notice-detail-content" id="notice-detail-content" th:text="${notice.contents}">공지 내용</div>
            </article>
        </div>
    </main>
</body>
</html>
